<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Xynir Live2D</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 500px;
        }
    </style>
</head>
<body>
    <canvas id="live2d"></canvas>

    <script src="libs/pixi.min.js"></script>
    <script src="libs/live2dcubismcore.min.js"></script>
    <script src="libs/pixi-live2d-display.min.js"></script>

    <script>
        window.addEventListener("load", async () => {
            try {
                const app = new PIXI.Application({
                    view: document.getElementById("live2d"),
                    autoStart: true,
                    width: 300,
                    height: 500,
                    transparent: true,
                    backgroundAlpha: 0,
                    antialias: true,
                    powerPreference: "high-performance",
                });

                // 加载模型
                const model = await PIXI.live2d.Live2DModel.from(
                    "model/hiyori_free_t08.model3.json"
                );

                // 让模型底部居中，适配窗口
                model.anchor.set(0.5, 1);          // 底部中心锚点
                model.x = app.screen.width / 2;    // 水平居中
                model.y = app.screen.height;       // 底部对齐
                model.scale.set(0.4);              // 缩放，可调整

                app.stage.addChild(model);

                console.log("Live2D 模型加载成功");
            } catch (error) {
                console.error("Live2D 加载失败:", error);
            }
        });
    </script>
</body>
</html>
